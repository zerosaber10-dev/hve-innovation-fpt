[project]
name = "hr-time-leave-agent"
version = "0.1.0"
description = "Ticket domain foundation for the HR time and leave agent"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.23,<5",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "openai>=1.20.0",
    "azure-identity>=1.15.0",
    "azure-cosmos>=4.6.0",
    "azure-functions>=1.18.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hr_time_leave"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
